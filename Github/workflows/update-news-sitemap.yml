name: Sync Google Sheet to GitHub

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types: [news_updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Google Sheet
        run: |
          python3 tools/generate_static_news.py

      - name: Check generated data
        run: |
          test -s news-data.json
          test -s ads-data.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news-data.json ads-data.json assets/news-media

          if git diff --cached --quiet; then
            echo "No changes from Google Sheet."
          else
            git commit -m "Sync Google Sheet data"
            git push
          fi
