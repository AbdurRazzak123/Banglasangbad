name: Sync Google Sheet to GitHub

on:
  push:
    branches: [main]

  repository_dispatch:
    types: [news_updated]

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync Google Sheets data
        run: python3 tools/generate_static_news.py

      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news-data.json ads-data.json news-media sitemap.xml news-sitemap.xml news

          if git diff --cached --quiet; then
            echo "No synced changes."
          else
            git commit -m "Sync Google Sheet data"
            git push
          fi
