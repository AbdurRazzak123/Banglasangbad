name: Sync Google Sheet to GitHub

on:
  repository_dispatch:
    types: [news_updated]

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync News and Ads from Google Sheet
        run: |
          for i in 1 2 3; do
            python3 tools/generate_static_news.py && break

            if [ "$i" -eq 3 ]; then
              echo "Sync failed after 3 attempts."
              exit 1
            fi

            echo "Sync attempt $i failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Validate synced data
        run: |
          test -s news-data.json
          test -s ads-data.json
          test -s sitemap.xml
          test -s news-sitemap.xml
          python3 - <<'PY'
          import json
          for name in ("news-data.json", "ads-data.json"):
              with open(name, encoding="utf-8") as f:
                  data = json.load(f)
              assert isinstance(data, dict)
              assert isinstance(data.get("table", {}).get("rows", []), list)
          print("GitHub data files are valid.")
          PY

      - name: Commit generated data and SEO output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news sitemap.xml news-sitemap.xml news-data.json ads-data.json
          if [ -d assets/news ]; then git add assets/news; fi
          if [ -d assets/ads ]; then git add assets/ads; fi

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Sync Google Sheet news and ads"
            git push
          fi
