name: Regenerate News Details

on:
  workflow_dispatch:

  push:
    paths:
      - 'home.html'
      - 'index.html'
      - 'national.html'
      - 'politics.html'
      - 'international.html'
      - 'economics.html'
      - 'sports.html'
      - 'entertainment.html'
      - 'technology.html'
      - 'tools/generate_static_news.py'
      - 'tools/news_assets.py'
      - 'ads-loader.js'
      - 'ads.css'
      - '.github/workflows/regenerate-news-details.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-news-details
  cancel-in-progress: false

jobs:
  regenerate:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4


      # --------------------------------------------------
      # 4. Generate news details from Google Sheet
      # --------------------------------------------------
      - name: Regenerate news details from Google Sheet
        env:
          NEWS_SHEET_ID: 1gX73WskIs3D-8IcyPJ24NT0xn1KIEJSjMXOF9nCQqTg
          NEWS_SHEET_NAME: Bangla News
          SITE_BASE_URL: https://abdurrazzak123.github.io/Banglasangbad/
        run: |
          python tools/generate_static_news.py


      # --------------------------------------------------
      # 5. Normalize news-data.json
      # --------------------------------------------------
      - name: Normalize news-data.json for website
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news-data.json")

          if not path.is_file():
              raise SystemExit("ERROR: news-data.json was not generated.")

          data = json.loads(path.read_text(encoding="utf-8"))

          news = data.get("news") or []

          if not news:
              raise SystemExit("ERROR: generator produced no news.")

          columns = [
              "ID",
              "Category",
              "Headline",
              "Details",
              "Image-1",
              "Date",
              "Video",
              "Image-2",
              "Image-3",
              "Keyword"
          ]

          data["table"] = {
              "columns": columns,
              "rows": [
                  {
                      "c": [
                          {
                              "v": item.get(col, "")
                          }
                          for col in columns
                      ]
                  }
                  for item in news
              ]
          }

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"SUCCESS: normalized {len(news)} news rows."
          )
          PY


      # --------------------------------------------------
      # 6. Create a clean valid sitemap.xml
      # --------------------------------------------------
      - name: Generate sitemap.xml
        env:
          SITE_BASE_URL: https://abdurrazzak123.github.io/Banglasangbad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.sax.saxutils import escape

          BASE = "https://abdurrazzak123.github.io/Banglasangbad"

          root = Path(".")

          data = json.loads(
              (root / "news-data.json").read_text(
                  encoding="utf-8"
              )
          )

          news = data.get("news") or []

          urls = []

          # Main website pages
          static_pages = [
              "",
              "index.html",
              "home.html",
              "national.html",
              "politics.html",
              "international.html",
              "economics.html",
              "sports.html",
              "entertainment.html",
              "technology.html",
              "more.html",
              "about.html",
              "privacy.html"
          ]

          for page in static_pages:
              if page == "":
                  url = BASE + "/"
              else:
                  url = BASE + "/" + page

              urls.append(url)

          # Generated news detail pages
          for item in news:
              article_id = str(item.get("ID", "")).strip()

              if not article_id:
                  continue

              page = root / "news" / f"{article_id}.html"

              if page.is_file():
                  urls.append(
                      f"{BASE}/news/{article_id}.html"
                  )

          # Remove duplicates while preserving order
          urls = list(dict.fromkeys(urls))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.append("  <url>")
              lines.append(
                  f"    <loc>{escape(url)}</loc>"
              )
              lines.append("  </url>")

          lines.append("</urlset>")

          sitemap = "\n".join(lines) + "\n"

          (root / "sitemap.xml").write_text(
              sitemap,
              encoding="utf-8"
          )

          print(
              f"SUCCESS: sitemap.xml generated with {len(urls)} URLs."
          )
          PY


      # --------------------------------------------------
      # 7. Create valid Google News sitemap
      # --------------------------------------------------
      - name: Generate news-sitemap.xml
        env:
          SITE_BASE_URL: https://abdurrazzak123.github.io/Banglasangbad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.sax.saxutils import escape
          from datetime import datetime

          BASE = "https://abdurrazzak123.github.io/Banglasangbad"

          root = Path(".")

          data = json.loads(
              (root / "news-data.json").read_text(
                  encoding="utf-8"
              )
          )

          news = data.get("news") or []

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"',
              '        xmlns:news="http://www.google.com/schemas/sitemap-news/0.9">'
          ]

          generated_count = 0

          for item in news:

              article_id = str(
                  item.get("ID", "")
              ).strip()

              if not article_id:
                  continue

              page = root / "news" / f"{article_id}.html"

              if not page.is_file():
                  continue

              headline = str(
                  item.get("Headline", "")
              ).strip()

              date_value = str(
                  item.get("Date", "")
              ).strip()

              if not headline:
                  continue

              # Try to convert common date formats.
              publication_date = None

              date_formats = [
                  "%Y-%m-%d",
                  "%Y/%m/%d",
                  "%d-%m-%Y",
                  "%d/%m/%Y",
                  "%Y-%m-%d %H:%M:%S",
                  "%Y/%m/%d %H:%M:%S",
                  "%d-%m-%Y %H:%M:%S",
                  "%d/%m/%Y %H:%M:%S"
              ]

              for fmt in date_formats:
                  try:
                      parsed = datetime.strptime(
                          date_value,
                          fmt
                      )

                      publication_date = (
                          parsed.strftime(
                              "%Y-%m-%dT%H:%M:%S+06:00"
                          )
                      )

                      break

                  except ValueError:
                      pass

              # If the Sheet date cannot be parsed,
              # use current UTC date/time.
              if not publication_date:
                  publication_date = (
                      datetime.utcnow().strftime(
                          "%Y-%m-%dT%H:%M:%S+00:00"
                      )
                  )

              url = (
                  f"{BASE}/news/{article_id}.html"
              )

              lines.append("  <url>")

              lines.append(
                  f"    <loc>{escape(url)}</loc>"
              )

              lines.append("    <news:news>")
              lines.append("      <news:publication>")

              lines.append(
                  "        <news:name>বাংলা সংবাদ</news:name>"
              )

              lines.append(
                  "        <news:language>bn</news:language>"
              )

              lines.append("      </news:publication>")

              lines.append(
                  "      <news:publication_date>"
                  + escape(publication_date)
                  + "</news:publication_date>"
              )

              lines.append(
                  "      <news:title>"
                  + escape(headline)
                  + "</news:title>"
              )

              lines.append("    </news:news>")
              lines.append("  </url>")

              generated_count += 1

          lines.append("</urlset>")

          sitemap = "\n".join(lines) + "\n"

          (root / "news-sitemap.xml").write_text(
              sitemap,
              encoding="utf-8"
          )

          print(
              "SUCCESS: news-sitemap.xml generated "
              f"with {generated_count} news URLs."
          )
          PY


      # --------------------------------------------------
      # 8. Validate generated XML
      # --------------------------------------------------
      - name: Validate sitemap XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [
              "sitemap.xml",
              "news-sitemap.xml"
          ]

          for filename in files:

              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"ERROR: {filename} does not exist."
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"ERROR: {filename} is empty."
                  )

              try:
                  ET.parse(path)
              except ET.ParseError as e:
                  raise SystemExit(
                      f"ERROR: {filename} is invalid XML: {e}"
                  )

              text = path.read_text(
                  encoding="utf-8"
              ).lstrip()

              if not text.startswith("<?xml"):
                  raise SystemExit(
                      f"ERROR: {filename} does not start with XML declaration."
                  )

              print(
                  f"SUCCESS: {filename} is valid XML."
              )
          PY


      # --------------------------------------------------
      # 9. Validate generated news pages
      # --------------------------------------------------
      - name: Validate generated output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")

          data = json.loads(
              (root / "news-data.json").read_text(
                  encoding="utf-8"
              )
          )

          news = data.get("news", [])

          if not news:
              raise SystemExit(
                  "ERROR: news-data.json contains no news."
              )

          table_rows = (
              data.get("table", {})
                  .get("rows", [])
          )

          if not table_rows:
              raise SystemExit(
                  "ERROR: news-data.json table.rows is empty."
              )

          if not all(
              isinstance(row, dict)
              and "c" in row
              for row in table_rows
          ):
              raise SystemExit(
                  "ERROR: table.rows is not in c/v format."
              )

          print(
              f"SUCCESS: {len(table_rows)} "
              "frontend-compatible rows."
          )

          news_dir = root / "news"

          if not news_dir.is_dir():
              raise SystemExit(
                  "ERROR: news directory does not exist."
              )

          pages = {
              p.stem
              for p in news_dir.glob("*.html")
          }

          missing = []

          for item in news:

              article_id = str(
                  item.get("ID", "")
              ).strip()

              if article_id and article_id not in pages:
                  missing.append(article_id)

          if missing:

              raise SystemExit(
                  "ERROR: missing detail pages: "
                  + ", ".join(missing[:20])
              )

          sample_pages = list(
              news_dir.glob("*.html")
          )

          if not sample_pages:
              raise SystemExit(
                  "ERROR: no Details pages generated."
              )

          for page in sample_pages:

              html = page.read_text(
                  encoding="utf-8"
              )

              required = [
                  'data-site-base="../"',
                  'id="live-date"',
                  'detail-live-date-script',
                  '../site-search.js'
              ]

              missing_bits = [
                  item
                  for item in required
                  if item not in html
              ]

              if missing_bits:

                  raise SystemExit(
                      f"ERROR: Details contract missing "
                      f"in {page}: "
                      + ", ".join(missing_bits)
                  )

          print(
              f"SUCCESS: Details contract verified "
              f"on {len(sample_pages)} pages."
          )

          ads_path = root / "ads-data.json"

          if ads_path.is_file():

              ads = json.loads(
                  ads_path.read_text(
                      encoding="utf-8"
                  )
              )

              ad_rows = (
                  ads.get("table", {})
                     .get("rows", [])
              )

              if ad_rows:

                  print(
                      f"SUCCESS: ads-data.json contains "
                      f"{len(ad_rows)} ad rows."
                  )

              else:

                  print(
                      "WARNING: Ads tab produced no rows."
                  )

          for required_file in [
              "news-data.json",
              "ads-data.json",
              "sitemap.xml",
              "news-sitemap.xml"
          ]:

              target = root / required_file

              if (
                  not target.is_file()
                  or target.stat().st_size == 0
              ):

                  raise SystemExit(
                      f"ERROR: missing/empty "
                      f"{required_file}"
                  )

          print(
              f"SUCCESS: {len(news)} news records "
              f"and {len(pages)} detail pages generated."
          )
          PY


      # --------------------------------------------------
      # 10. Commit generated files
      # --------------------------------------------------
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            news \
            assets/news \
            news-data.json \
            ads-data.json \
            sitemap.xml \
            news-sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Fix and regenerate news sitemaps"
            git push
          fi
