name: Banglasangbad Final One File Installer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/banglasangbad-final-installer.yml

permissions:
  contents: write

concurrency:
  group: banglasangbad-final-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final site files
        shell: bash
        run: |
          set -e
          mkdir -p tools
          python3 - <<'PY'
          import base64, pathlib
          payloads = {
            'home.html': '',
            'news-reader.js': '',
            'tools/generate_static_news.py': '',
          }
          for path, data in payloads.items():
              p=pathlib.Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(base64.b64decode(data))
          PY

      - name: Build news, category pages and SEO files
        run: python3 tools/generate_static_news.py

      - name: Commit all final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html news-reader.js tools/generate_static_news.py news news-data.json sitemap.xml news-sitemap.xml national.html politics.html international.html economy.html sports.html entertainment.html technology.html more.html advertise.html .github/workflows/banglasangbad-final-installer.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply final Banglasangbad news and mobile fixes"
            git push
          fi
