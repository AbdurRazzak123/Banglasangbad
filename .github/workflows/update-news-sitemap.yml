name: Sync Google Sheet to GitHub

on:
  # Backup: GitHub checks every 5 minutes.
  # GitHub documents that scheduled runs can be delayed during high load,
  # so the event-driven repository_dispatch below is the preferred path.
  schedule:
    - cron: '*/5 * * * *'

  # Preferred path: Google Apps Script sends event_type=news_updated
  # after the Google Sheet data is successfully updated.
  repository_dispatch:
    types: [news_updated]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-google-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate static news
        env:
          SITE_BASE_URL: https://abdurrazzak123.github.io/Banglasangbad
        run: |
          python generate_static_news.py

      - name: Check generated files
        run: |
          git status --short

      - name: Commit website/news updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add news-data.json
          git add news
          git add index.html
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo 'No website/news changes to commit.'
          else
            git commit -m 'Sync Google Sheet news to website'
            git push
          fi
