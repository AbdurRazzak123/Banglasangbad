name: Sync Google Sheet to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [news_updated]

permissions:
  contents: write

concurrency:
  group: sync-sheet-to-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4

      - name: Preflight Google Sheet
        env:
          NEWS_SHEET_ID: 1gX73WskIs3D-8IcyPJ24NT0xn1KIEJSjMXOF9nCQqTg
          NEWS_SHEET_NAME: Bangla News
        run: python tools/news_preflight.py

      - name: Patch generator compatibility
        run: python tools/patch_generator.py

      - name: Generate static news
        env:
          NEWS_SHEET_ID: 1gX73WskIs3D-8IcyPJ24NT0xn1KIEJSjMXOF9nCQqTg
          NEWS_SHEET_NAME: Bangla News
          SITE_BASE_URL: https://abdurrazzak123.github.io/Banglasangbad/
        run: python tools/generate_static_news.py

      - name: Validate generated site
        run: |
          test -s news-data.json
          test -s sitemap.xml
          test -s news-sitemap.xml
          test -d news

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("news-data.json").read_text(encoding="utf-8"))
          rows = data.get("table", {}).get("rows", [])
          valid = []
          for row in rows:
              c = row.get("c", [])
              def v(i):
                  return str(c[i].get("v", "") if i < len(c) and c[i] else "").strip()
              if v(0) and v(2):
                  valid.append(v(0))

          if not valid:
              raise SystemExit("ERROR: news-data.json contains no valid ID + Headline rows.")

          pages = {p.stem for p in Path("news").glob("*.html")}
          missing = [x for x in valid if x not in pages]
          if missing:
              raise SystemExit("ERROR: missing detail pages: " + ", ".join(missing[:20]))

          print(f"VALID: {len(valid)} news rows and {len(pages)} detail pages.")
          PY

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            news \
            news-data.json \
            ads-data.json \
            news-media \
            sitemap.xml \
            news-sitemap.xml \
            home.html \
            index.html \
            national.html \
            politics.html \
            international.html \
            economy.html \
            sports.html \
            entertainment.html \
            technology.html \
            more.html \
            about.html \
            contact.html \
            privacy.html \
            disclaimer.html \
            advertise.html

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Sync Google Sheet news"
            git push
          fi
