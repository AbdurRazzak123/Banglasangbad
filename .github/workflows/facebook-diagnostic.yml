name: Facebook Publish Diagnostic (Read Only)

on:
  workflow_dispatch:
    inputs:
      news_id:
        description: 'News/article ID to check (example: 25; leave blank to skip URL checks)'
        required: false
        type: string
      post_id:
        description: 'Existing Facebook post ID to inspect via Meta API (optional; not the news ID)'
        required: false
        type: string
      post_url:
        description: 'Paste the exact affected Facebook post permalink; this is tested without login/token'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run read-only diagnostics
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://abdurrazzak123.github.io/Banglasangbad' }}
          DIAG_NEWS_ID: ${{ inputs.news_id }}
          DIAG_POST_ID: ${{ inputs.post_id }}
          DIAG_POST_URL: ${{ inputs.post_url }}
        run: |
          args=()
          if [ -n "$DIAG_NEWS_ID" ]; then args+=(--news-id "$DIAG_NEWS_ID"); fi
          if [ -n "$DIAG_POST_ID" ]; then args+=(--post-id "$DIAG_POST_ID"); fi
          if [ -n "$DIAG_POST_URL" ]; then args+=(--post-url "$DIAG_POST_URL"); fi
          python tools/facebook_diagnostic.py "${args[@]}"
