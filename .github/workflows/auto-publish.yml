name: Social Auto Publish - Facebook Instagram X Threads YouTube

on:
  # Safety net: check every 5 minutes.
  schedule:
    - cron: '*/5 * * * *'
  # Preferred path: run immediately after the Sheet -> GitHub sync succeeds.
  workflow_run:
    workflows: ['Sync Google Sheet to GitHub']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and build cards without publishing'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Maximum new/failed articles to process in this run'
        required: false
        default: '5'
        type: string

permissions:
  contents: write

concurrency:
  group: social-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bengali fonts and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install social automation dependencies
        run: python -m pip install --upgrade pip requests Pillow

      - name: Run social publisher
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://abdurrazzak123.github.io/Banglasangbad' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          AUTO_YOUTUBE_VIDEO: ${{ vars.AUTO_YOUTUBE_VIDEO || 'true' }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK || 'true' }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || 'true' }}
          ENABLE_X: ${{ vars.ENABLE_X || 'true' }}
          ENABLE_THREADS: ${{ vars.ENABLE_THREADS || 'true' }}
          ENABLE_YOUTUBE: ${{ vars.ENABLE_YOUTUBE || 'true' }}
        run: |
          DRY=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY='--dry-run'; fi
          LIMIT='${{ inputs.limit }}'
          if [ -z "$LIMIT" ]; then LIMIT='5'; fi
          python automation/auto_publish.py $DRY --limit "$LIMIT"

      - name: Commit social state and generated social cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-publish-state.json social-publish-log.json social-media
          if git diff --cached --quiet; then
            echo 'No social state/card changes.'
          else
            git commit -m 'Update social auto-publish state'
            git push
          fi
