name: Premium Social Auto Publish - Facebook + Instagram

on:
  # Safety net: check every 5 minutes.
  schedule:
    - cron: '*/5 * * * *'
  # Preferred path: run immediately after the Sheet -> GitHub sync succeeds.
  workflow_run:
    workflows: ['Sync Google Sheet to GitHub']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and build cards without publishing'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Maximum new/failed articles to process in this run'
        required: false
        default: '5'
        type: string

permissions:
  contents: write

concurrency:
  group: social-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bengali fonts and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install social automation dependencies
        run: python -m pip install --upgrade pip requests Pillow

      - name: Validate Meta credentials before publishing
        if: inputs.dry_run != true
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python tools/meta_preflight.py

      - name: Run social publisher
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://abdurrazzak123.github.io/Banglasangbad' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK || 'true' }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || 'true' }}
          ENABLE_X: 'false'
          ENABLE_THREADS: 'false'
          ENABLE_YOUTUBE: 'false'
        run: |
          DRY=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY='--dry-run'; fi
          LIMIT='${{ inputs.limit }}'
          if [ -z "$LIMIT" ]; then LIMIT='5'; fi
          python automation/auto_publish.py $DRY --limit "$LIMIT"

      - name: Verify publisher state is present
        run: |
          test -s social-publish-state.json
          test -s social-publish-log.json
          echo 'Premium publisher state verified.'
