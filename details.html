<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>সংবাদ | বাংলা সংবাদ</title><script>(function(){const p=new URLSearchParams(location.search);const id=(p.get("id")||p.get("news")||"").trim();location.replace(id?"news/"+encodeURIComponent(id)+".html":"index.html");})();</script></head><body>সংবাদ পেজে নেওয়া হচ্ছে...
<script id="details-search-date-mobile">
(function(){
  function norm(s){
    return (s||"").toLowerCase().replace(/\s+/g," ").trim();
  }
  function setupSearch(){
    var inputs = Array.from(document.querySelectorAll(
      'input[type="search"], input[placeholder*="সার্চ"], input[placeholder*="Search"], input[name*="search" i], input[id*="search" i]'
    ));
    inputs.forEach(function(input){
      if(input.dataset.detailsSearchReady) return;
      input.dataset.detailsSearchReady="1";
      var form=input.closest("form");
      function go(e){
        if(e) e.preventDefault();
        var q=norm(input.value);
        if(!q){ input.focus(); return false; }

        // Search within already-rendered news cards/list items.
        var candidates=Array.from(document.querySelectorAll(
          'article, .news-card, .news-item, .card, .post, .headline, .news-list a, main a'
        ));
        var found=candidates.filter(function(el){
          return norm(el.innerText).indexOf(q)!==-1;
        });

        if(found.length){
          found[0].scrollIntoView({behavior:"smooth", block:"center"});
          found.forEach(function(el){ el.classList.add("details-search-hit"); });
          setTimeout(function(){
            found.forEach(function(el){ el.classList.remove("details-search-hit"); });
          },2500);
          return false;
        }

        // If this is a generated site with a search page, send the query there.
        var searchLink = Array.from(document.querySelectorAll('a[href]')).find(function(a){
          return /search/i.test(a.getAttribute("href")||"") ||
                 /সার্চ|search/i.test(a.innerText||"");
        });
        if(searchLink){
          var url=new URL(searchLink.href, location.href);
          url.searchParams.set("q", input.value.trim());
          location.href=url.href;
        } else {
          alert("এই সংবাদটি খুঁজে পাওয়া যায়নি।");
        }
        return false;
      }
      input.addEventListener("keydown", function(e){
        if(e.key==="Enter") go(e);
      });
      if(form) form.addEventListener("submit", go);
    });
  }

  function setupDate(){
    var dateText="মঙ্গলবার 15 সেপ্টেম্বর ২০২৬";
    // Update only the visible date text in the logo/header bar.
    var selectors=[
      '.logo-bar .date','.logo-bar .date-text','.logo-bar .header-date',
      '.header .date','.header-date','.date-display','.current-date',
      '[data-date]'
    ];
    var nodes=[];
    selectors.forEach(function(s){
      document.querySelectorAll(s).forEach(function(n){nodes.push(n);});
    });
    nodes.forEach(function(n){
      n.textContent=dateText;
      n.classList.add("details-header-date");
    });
  }

  function run(){
    setupSearch();
    setupDate();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run);
  else run();
})();
</script>

<style id="details-search-date-mobile-css">
.details-search-hit{outline:3px solid currentColor; outline-offset:3px;}
.details-header-date{white-space:nowrap;}
@media(max-width:768px){
  .logo-bar .date,.logo-bar .date-text,.logo-bar .header-date,
  .header .date,.header-date,.date-display,.current-date,
  [data-date],.details-header-date{
    display:block !important;
    max-width:100% !important;
    white-space:nowrap !important;
    overflow:visible !important;
    text-overflow:clip !important;
    font-size:clamp(12px,3.4vw,16px) !important;
    line-height:1.35 !important;
    text-align:center !important;
  }
}
</style>

</body></html>
